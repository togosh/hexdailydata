# Offline Task09: all application sockets remain on the internal network.
# Host browser ingress is a byte-only docker-exec pipe (tests/integration/ingress.mjs).
services:
  api:
    command: [node, '${HDD_V2_INTEGRATION_API_ENTRY:-tests/integration/api.mjs}']
    networks: !override [private]
    ports: !reset []
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - ${HDD_V2_OPERATOR_INPUT}:/input:ro
      - ${HDD_V2_OPS_EVIDENCE}:/evidence
  worker:
    command: [node, tests/integration/worker.mjs, watch]
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - ${HDD_V2_OPERATOR_INPUT}:/input:ro
      - ${HDD_V2_OPS_EVIDENCE}:/evidence
