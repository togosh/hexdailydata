services:
  runner:
    environment:
      HDD_V2_DAILY_PHASE: ${HDD_V2_DAILY_PHASE:-functional}
    volumes:
      - ${HDD_V2_DAILY_EVIDENCE:?Task-owned evidence}:/evidence
      - exports:/exports
    command: ['node', 'tests/daily/run.mjs']
  storage-init:
    image: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    network_mode: none
    volumes:
      - exports:/exports
    command: ['chown', '1000:1000', '/exports']
volumes:
  exports:
