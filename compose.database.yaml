# Optional local database only; task 02 qualifies schema/roles. Never reuse a v1 volume.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hexdailydata_v2
      POSTGRES_USER: hdd_v2_migrator
      POSTGRES_PASSWORD: ${HDD_V2_POSTGRES_PASSWORD:?Set a NEW v2-only password before using Compose}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdd_v2_migrator -d hexdailydata_v2"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Never publish this DB port or mount the old host database here.
volumes:
  db_data:
