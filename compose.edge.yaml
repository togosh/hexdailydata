services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [edge]
    cpus: 0.125
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    # The official binary carries this file capability, even for local port8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    user: '1000:1000'
    tmpfs: ['/data:uid=1000,gid=1000', '/config:uid=1000,gid=1000']
    volumes: [./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro]
    ports: ['127.0.0.1:${HDD_V2_EDGE_PORT:-4322}:8080']
    networks: [private, ingress]
